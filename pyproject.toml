[project]
name = "finratio"
version = "0.1.0"
description = "Small, dependency-free financial ratio helpers"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["finratio"]
